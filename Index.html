<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кластерний аналіз</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        table { border-collapse: collapse; margin: 20px auto; }
        th, td { border: 1px solid black; padding: 5px; text-align: center; }
        input { width: 50px; text-align: center; }
        button { margin: 10px; padding: 10px; cursor: pointer; }
        .steps { text-align: left; margin: 20px auto; max-width: 600px; }
    </style>
</head>
<body>
    <h1>Кластерний аналіз</h1>
    <table id="dataTable">
        <tr>
            <th>Пацієнти</th>
            <th>Х1</th>
            <th>Х2</th>
            <th>Х3</th>
            <th>Х4</th>
            <th>Х5</th>
        </tr>
        <tr><td>Р1</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr>
        <tr><td>Р2</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr>
        <tr><td>Р3</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr>
        <tr><td>Р4</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr>
        <tr><td>Р5</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr>
        <tr><td>Р6</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr>
        <tr><td>Р7</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td></tr>
    </table>
    <button onclick="calculateClusters()">Обчислити кластери</button>
    <h2>Результати:</h2>
    <p id="result"></p>
    <div class="steps" id="steps"></div>
    
    <script>
        function calculateClusters() {
            let table = document.getElementById("dataTable");
            let steps = document.getElementById("steps");
            steps.innerHTML = "<h2>Покрокове розв'язування:</h2>";
            let data = [];
            
            for (let i = 1; i < table.rows.length; i++) {
                let row = [];
                for (let j = 1; j < table.rows[i].cells.length; j++) {
                    let value = parseFloat(table.rows[i].cells[j].children[0].value);
                    if (isNaN(value)) {
                        document.getElementById("result").innerText = "Будь ласка, введіть всі значення!";
                        return;
                    }
                    row.push(value);
                }
                data.push(row);
            }
            
            steps.innerHTML += "<p><b>Вхідні дані:</b> " + JSON.stringify(data) + "</p>";
            
            let sums = data.reduce((acc, row) => row.map((val, i) => (acc[i] || 0) + val), []);
            steps.innerHTML += "<p><b>Сума по кожному параметру:</b> " + JSON.stringify(sums) + "</p>";
            
            let normalized = data.map(row => row.map((val, i) => val / sums[i]));
            steps.innerHTML += "<p><b>Нормалізовані значення:</b> " + JSON.stringify(normalized.map(row => row.map(v => v.toFixed(6)))) + "</p>";
            
            let distances = Array(data.length).fill().map(() => Array(data.length).fill(0));
            
            for (let i = 0; i < data.length; i++) {
                for (let j = i + 1; j < data.length; j++) {
                    distances[i][j] = distances[j][i] = Math.sqrt(
                        normalized[i].reduce((sum, val, k) => sum + Math.pow(val - normalized[j][k], 2), 0)
                    ).toFixed(6);
                }
            }
            
            steps.innerHTML += "<p><b>Матриця відстаней:</b> " + JSON.stringify(distances) + "</p>";
            
            let minDistances = distances.map(row => Math.min(...row.filter(v => v > 0)));
            let threshold = Math.max(...minDistances).toFixed(6);
            steps.innerHTML += "<p><b>Критична відстань:</b> " + threshold + "</p>";
            
            let clusters = [];
            let assigned = new Array(data.length).fill(false);
            
            for (let i = 0; i < data.length; i++) {
                if (!assigned[i]) {
                    let cluster = [i + 1];
                    assigned[i] = true;
                    for (let j = 0; j < data.length; j++) {
                        if (!assigned[j] && distances[i][j] <= threshold) {
                            cluster.push(j + 1);
                            assigned[j] = true;
                        }
                    }
                    clusters.push(cluster);
                }
            }
            
            steps.innerHTML += "<p><b>Фінальні кластери:</b> " + JSON.stringify(clusters) + "</p>";
            document.getElementById("result").innerText = "Кластери: " + clusters.map(c => `{${c.join(', ')}}`).join(' ');
        }
    </script>
</body>
</html>
